name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, análise estática e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Configura o cache do Gradle e valida o checksum do wrapper commitado.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Análise estática (ktlint e Android Lint)
        run: ./gradlew ktlintCheck :build-logic:convention:ktlintCheck :app:lintDebug

      - name: Testes unitários
        run: ./gradlew test

      - name: APK debug
        run: ./gradlew :app:assembleDebug

      # Permite instalar e avaliar o app sem compilar o projeto.
      - name: Publicar APK debug
        uses: actions/upload-artifact@v7
        with:
          name: kds-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar relatórios (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  commits:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # O hook local pode ser pulado com --no-verify; aqui a regra vale para todo PR.
      - name: Validar commits do PR com o hook do repositório
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha fora do padrão"
              status=1
            fi
          done
          exit $status
