# Testes de UI na API 36 (Android 16), uma abaixo do targetSdk 37: o Espresso usado pelo teste de
# Compose chama InputManager.getInstance(), removido no Android 17, e falha na API 37.
# Rever quando o androidx.test acompanhar o Android 17.
sdk=36

# O board é a tela do tablet deitado na cozinha: 1920x1200 a 320 dpi (o emulador de validação).
# Sem isto, o Robolectric simula um celular de 320 dp de largura, que não é o alvo desta tela.
qualifiers=w960dp-h600dp-land-xhdpi
